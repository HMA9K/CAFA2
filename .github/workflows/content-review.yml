name: CAFA2 content review
on:
  push:
    branches: [cafa2-inhoud-revisie-20260920]
    paths: [.github/workflows/content-review.yml, scripts/**, content/**, tests/**]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Snapshot for isolated visual and content review
        run: git archive HEAD -o /tmp/cafa2-review.tar
      - uses: actions/upload-artifact@v4
        with:
          name: cafa2-review-snapshot
          path: /tmp/cafa2-review.tar
          retention-days: 2
