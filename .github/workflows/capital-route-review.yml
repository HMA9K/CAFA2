name: CAFA2 capital route review
on:
  push:
    branches: [cafa2-kapitaalroute-100pct-20260922]
    paths:
      - '.github/workflows/capital-route-review.yml'
      - 'content/summary/addenda.mjs'
      - 'content/study/capital-flow.mjs'
      - 'js/study-wizard.js'
      - 'tests/study-refinement-browser.py'
permissions:
  contents: write
concurrency:
  group: cafa2-capital-route-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build study application
        run: |
          python -m pip install -q tinycss2
          npm run build:study
          npm test
      - name: Install browsers
        run: |
          python -m pip install -q playwright
          python -m playwright install --with-deps chromium webkit >/tmp/browser-install.log 2>&1 || { tail -60 /tmp/browser-install.log; exit 1; }
      - name: Test capital route in Chromium and WebKit
        run: |
          python tests/study-refinement-browser.py
          python tests/study-upgrade-browser.py
      - name: Save verified generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add samenvatting.html css/study-dark.css
          if ! git diff --cached --quiet; then
            git commit -m 'Build verified capital route and 100 percent example'
            git push origin HEAD:cafa2-kapitaalroute-100pct-20260922
          fi
