name: CAFA2 assistant checks
on:
  push:
    branches: [main, codex/cafa2-assistant-handoff]
    paths:
      # Assistant code, endpoints, build, source registration and tests.
      - '.github/workflows/assistant-handoff.yml'
      - 'assistant/**'
      - 'functions/api/study-*.js'
      - 'js/study-assistant*.mjs'
      - 'css/study-assistant*.css'
      - 'scripts/*assistant*.mjs'
      - 'scripts/extract-presentation-sources.py'
      - 'tests/study-assistant/**'
      - 'tests/answer-feedback-toggle-browser.py'
      # Question content, cases, solutions and original source documents.
      - 'data/**'
      - 'content/practice/**'
      - 'content/revision/**'
      - 'fragments/**'
      - 'docs/mc-audit/exam-frequency.json'
      - '**.pdf'
      - '**.doc'
      - '**.docx'
      - '**.ppt'
      - '**.pptx'
      - '**.xls'
      - '**.xlsx'
      - 'scripts/build-practice*.mjs'
      - 'scripts/build-exam*'
      - 'scripts/exam-practice*'
      - 'scripts/author-exam*'
      # Shared code that supplies questions/answers or hosts the assistant panel.
      - 'index.html'
      - 'js/app.js'
      - 'js/bootstrap.js'
      - 'js/startup.js'
      - 'js/practice-*.js'
      - 'js/opgave-practice.js'
      - 'js/exam-*.js'
      - 'js/exam-*.mjs'
      - 'js/exams.js'
      - 'js/answer-*.js'
      - 'js/tinymce-answer-editor.js'
      - 'js/journal-table.js'
      - 'js/stock-table.js'
      - 'js/input-table-layout.js'
      - 'js/study-shell.js'
      - 'js/study-theme.js'
      - 'js/page-scale.js'
      - 'css/app.css'
      - 'css/startup.css'
      - 'css/practice-*.css'
      - 'css/exam-*.css'
      - 'css/exams.css'
      - 'css/answer-*.css'
      - 'css/tinymce-answer-editor.css'
      - 'css/journal-display.css'
      - 'css/stock-table.css'
      - 'css/input-table-layout.css'
      - 'css/study-ui.css'
      - 'css/study-dark.css'
      - 'vendor/tinymce/**'
      # Build dependencies and routing/security settings used by the endpoints.
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
      - 'yarn.lock'
      - 'wrangler.*'
      - '_headers'
      - '_redirects'
      - '_routes.json'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  # Keep validation evidence for each commit when another change is published.
  group: assistant-handoff-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assistant tests, including real question coverage
        run: |
          mkdir -p /tmp/assistant-qa
          node --test tests/study-assistant/*.test.mjs 2>&1 | tee /tmp/assistant-qa/node-tests.log
      - name: Integrate in runner only and build
        run: |
          node scripts/prepare-study-assistant.mjs --apply
          node scripts/build-study-assistant.mjs | tee /tmp/assistant-qa/build.log
          node scripts/verify-study-assistant-build.mjs | tee /tmp/assistant-qa/build-verification.log
      - name: Existing repository regression tests
        run: npm test 2>&1 | tee /tmp/assistant-qa/regression.log
      - name: Bundle all Pages Functions
        run: npx --yes esbuild@0.25.10 functions/api/study-*.js --bundle --format=esm --platform=browser --outdir=/tmp/assistant-qa/functions
      - name: Install browser-test dependencies
        run: |
          pip install playwright==1.57.0 openpyxl==3.1.5
          python -m playwright install --with-deps chromium webkit
      - name: Embedded presentation source regression
        run: python tests/study-assistant/presentation-sources.py
      - name: Real interface with mocked answer service in Chromium
        env:
          ASSISTANT_QA_OUT: /tmp/assistant-qa/chromium
        run: |
          python tests/study-assistant/browser.py 2>&1 | tee /tmp/assistant-qa/browser-chromium.log
          python tests/study-assistant/popup-menu-browser.py 2>&1 | tee /tmp/assistant-qa/popup-menu-chromium.log
          python tests/answer-feedback-toggle-browser.py 2>&1 | tee /tmp/assistant-qa/feedback-toggle-chromium.log
      - name: Real interface with mocked answer service in WebKit
        env:
          ASSISTANT_BROWSER: webkit
          ASSISTANT_QA_OUT: /tmp/assistant-qa/webkit
        run: |
          python tests/study-assistant/browser.py 2>&1 | tee /tmp/assistant-qa/browser-webkit.log
          python tests/study-assistant/popup-menu-browser.py 2>&1 | tee /tmp/assistant-qa/popup-menu-webkit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cafa2-assistant-handoff-checks
          path: /tmp/assistant-qa
          retention-days: 7
